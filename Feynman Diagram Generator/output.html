<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feynman Diagram Generator - Graph Stream</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" type="image/x-icon" href="icon.ico">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono-code { font-family: 'Fira Code', monospace; }
  </style>
</head>
<body class="min-h-full flex flex-col bg-slate-950 text-slate-100 p-3 sm:p-6 antialiased">

  <!-- Header Bar -->
  <header class="w-full max-w-7xl mx-auto flex items-center justify-between pb-3.5 border-b border-slate-800 sticky top-0 bg-slate-950/95 backdrop-blur z-30">
    <div class="flex items-center gap-3">
      <span id="status-pulse" class="w-3 h-3 rounded-full bg-indigo-500 animate-ping"></span>
      <div>
        <h1 id="header-status" class="text-xs sm:text-base font-bold text-slate-100 font-mono-code flex items-center gap-2">
          <span>Initializing Engine...</span>
        </h1>
        <p id="sub-status" class="text-xs text-cyan-300 font-mono-code font-semibold">(Loading Formula...)</p>
      </div>
    </div>
    
    <div class="flex items-center gap-2">
      <button id="btn-download-pdf" type="button" onclick="downloadAllDiagramsPDF()" class="px-4 py-2 rounded-xl text-xs font-bold bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg shadow-emerald-600/30 transition-all flex items-center gap-1.5 cursor-pointer active:scale-95">
        <i class="fa-solid fa-file-pdf text-xs"></i>
        <span>Download PDF</span>
      </button>
      <button id="btn-download-json" type="button" onclick="downloadAllDiagramsJSON()" class="px-4 py-2 rounded-xl text-xs font-bold bg-sky-600 hover:bg-sky-500 text-white shadow-lg shadow-sky-600/30 transition-all flex items-center gap-1.5 cursor-pointer active:scale-95">
        <i class="fa-solid fa-file-code text-xs"></i>
        <span>Download JSON</span>
      </button>
      <button id="btn-stop-generation" type="button" onclick="handleStopClick()" class="px-4 py-2 rounded-xl text-xs font-bold bg-rose-600 hover:bg-rose-500 text-white shadow-lg shadow-rose-600/30 transition-all flex items-center gap-1.5 cursor-pointer active:scale-95">
        <i class="fa-solid fa-hand text-xs"></i>
        <span>Stop</span>
      </button>
    </div>
  </header>

  <!-- Output Container -->
  <main id="diagrams-root" class="w-full max-w-7xl mx-auto py-6 space-y-8 flex-1">
  </main>

  <!-- Scripts -->
  <script src="particles.js"></script>
  <script src="vertices.js"></script>
  <script src="graph_engine.js"></script>
  <script src="image_engine.js"></script>
  <script src="main.js"></script>

  <!-- Output UI Handler Object -->
  <script>
    function handleStopClick() {
      if (window.MainEngine) {
        window.MainEngine.stop();
      }
      const btn = document.getElementById('btn-stop-generation');
      if (btn) {
        btn.disabled = true;
        btn.classList.add('opacity-40', 'cursor-not-allowed');
      }
      document.getElementById('header-status').textContent = 'Generation Stopped by User';
      document.getElementById('header-status').className = 'text-xs sm:text-base font-bold text-amber-400 font-mono-code flex items-center gap-2';
      document.getElementById('status-pulse').className = 'w-3 h-3 rounded-full bg-amber-500';
    }

    async function svgElementToDataUrl(svgElement, scale = 2) {
      const serializer = new XMLSerializer();
      const svgCopy = svgElement.cloneNode(true);
      svgCopy.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      svgCopy.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
      svgCopy.removeAttribute('class');
      const vb = (svgCopy.getAttribute('viewBox') || '0 0 300 200').trim().split(/\s+/).map(Number);
      const width = Math.max(1, vb[2] || 300);
      const height = Math.max(1, vb[3] || 200);
      svgCopy.setAttribute('width', String(width));
      svgCopy.setAttribute('height', String(height));
      const svgText = '<?xml version="1.0" encoding="UTF-8"?>' + serializer.serializeToString(svgCopy);
      const blob = new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      try {
        const img = await new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = () => reject(new Error('Unable to render one of the diagrams for PDF export.'));
          image.src = url;
        });
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.ceil(width * scale));
        canvas.height = Math.max(1, Math.ceil(height * scale));
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        return { dataUrl: canvas.toDataURL('image/png'), width, height };
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    async function downloadAllDiagramsPDF() {
      const button = document.getElementById('btn-download-pdf');
      const diagrams = Array.from(document.querySelectorAll('#diagrams-root .diagram-card svg'));
      if (!diagrams.length) {
        alert('No diagrams have been generated yet.');
        return;
      }
      if (!window.jspdf || !window.jspdf.jsPDF) {
        alert('PDF export is unavailable because the PDF library could not be loaded.');
        return;
      }

      const originalHtml = button.innerHTML;
      button.disabled = true;
      button.classList.add('opacity-60', 'cursor-not-allowed');
      button.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-xs"></i><span>Creating PDF...</span>';

      try {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ orientation: 'portrait', unit: 'pt', format: 'a4', compress: true });
        pdf.setProperties({ title: 'Feynman Diagrams', subject: 'Generated Feynman diagrams', author: 'dga606', creator: 'dga606', keywords: 'dga606' });
        const pageWidth = 595.28;
        const pageHeight = 841.89;
        const margin = 36;
        const gap = 16;
        const colWidth = (pageWidth - 2 * margin - gap) / 2;
        const rowHeight = 168;
        const cols = 2;
        const rows = 4;

        pdf.setFont('helvetica', 'bold');
        pdf.setFontSize(13);
        pdf.text('Feynman Diagrams', margin, margin);

        for (let i = 0; i < diagrams.length; i++) {
          const slot = i % (cols * rows);
          if (i > 0 && slot === 0) pdf.addPage();

          const row = Math.floor(slot / cols);
          const col = slot % cols;
          const x = margin + col * (colWidth + gap);
          const y = margin + 18 + row * (rowHeight + gap);
          const item = await svgElementToDataUrl(diagrams[i], 2);

          const panelPad = 6;
          const labelH = 14;
          const availableW = colWidth - 2 * panelPad;
          const availableH = rowHeight - labelH - 2 * panelPad;
          const scale = Math.min(availableW / item.width, availableH / item.height);
          const drawW = item.width * scale;
          const drawH = item.height * scale;
          const drawX = x + (colWidth - drawW) / 2;
          const drawY = y + labelH + panelPad + (availableH - drawH) / 2;

          pdf.setDrawColor(190, 190, 190);
          pdf.rect(x, y, colWidth, rowHeight);
          pdf.setFont('helvetica', 'bold');
          pdf.setFontSize(8);
          pdf.text('Diagram #' + (i + 1), x + panelPad, y + 10);
          pdf.addImage(item.dataUrl, 'PNG', drawX, drawY, drawW, drawH, undefined, 'FAST');
        }

        const pageCount = pdf.getNumberOfPages();
        for (let page = 1; page <= pageCount; page++) {
          pdf.setPage(page);
          pdf.setFont('helvetica', 'normal');
          pdf.setFontSize(7);
          pdf.setTextColor(90, 90, 90);
          pdf.text('Page ' + page + ' of ' + pageCount, pageWidth - margin, pageHeight - 18, { align: 'right' });
        }

        pdf.save('feynman-diagrams.pdf');
      } catch (err) {
        console.error(err);
        alert('Unable to create PDF: ' + (err && err.message ? err.message : err));
      } finally {
        button.disabled = false;
        button.classList.remove('opacity-60', 'cursor-not-allowed');
        button.innerHTML = originalHtml;
      }
    }

    function downloadAllDiagramsJSON() {
      const button = document.getElementById('btn-download-json');
      const diagrams = Array.isArray(window.__OUTPUT_DIAGRAMS) ? window.__OUTPUT_DIAGRAMS : [];
      if (!diagrams.length) {
        alert('No diagrams have been generated yet.');
        return;
      }

      const payload = {
        exportData: { author: 'dga606' },
        version: 1,
        createdAt: Date.now(),
        scatteringConfig: window.__OUTPUT_SCATTERING_CONFIG || {},
        sharedData: window.__DIAGRAM_SHARED_DATA || {},
        diagrams: diagrams.map((diagramData, index) => ({
          index: index + 1,
          diagramData
        }))
      };

      const originalHtml = button.innerHTML;
      button.disabled = true;
      button.classList.add('opacity-60', 'cursor-not-allowed');
      button.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-xs"></i><span>Creating JSON...</span>';

      try {
        const json = JSON.stringify(payload, null, 2);
        const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'feynman-diagrams.json';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (err) {
        console.error(err);
        alert('Unable to create JSON: ' + (err && err.message ? err.message : err));
      } finally {
        button.disabled = false;
        button.classList.remove('opacity-60', 'cursor-not-allowed');
        button.innerHTML = originalHtml;
      }
    }

    window.OutputUI = {
      setFormula(formulaText) {
        document.getElementById('sub-status').textContent = formulaText;
      },

      setStatus(exactOrder, isComplete, totalCount) {
        const headerStatus = document.getElementById('header-status');
        const statusPulse = document.getElementById('status-pulse');
        const btnStop = document.getElementById('btn-stop-generation');

        if (isComplete) {
          headerStatus.textContent = `Generation Complete - Found ${totalCount} Diagram(s)`;
          headerStatus.className = 'text-xs sm:text-base font-bold text-emerald-400 font-mono-code flex items-center gap-2';
          statusPulse.className = 'w-3 h-3 rounded-full bg-emerald-400';
          if (btnStop) {
            btnStop.disabled = true;
            btnStop.classList.add('opacity-40', 'cursor-not-allowed');
          }

          if (totalCount === 0) {
            document.getElementById('diagrams-root').innerHTML = `
              <div class="text-center py-20 text-slate-500 font-mono-code border border-dashed border-slate-800 rounded-3xl m-4">
                No Feynman diagrams found matching these reaction constraints.
              </div>
            `;
          }
        } else {
          headerStatus.innerHTML = `<span>Generating Diagrams of Order ${exactOrder}</span>`;
        }
      },

      showError(message) {
        document.getElementById('header-status').textContent = 'Error';
        document.getElementById('header-status').className = 'text-xs sm:text-base font-bold text-rose-400 font-mono-code';
        document.getElementById('sub-status').textContent = message;
        document.getElementById('status-pulse').className = 'w-3 h-3 rounded-full bg-rose-500';
      },

      createOrderSection(exactOrder, count) {
        const root = document.getElementById('diagrams-root');
        const section = document.createElement('section');
        section.id = `section-order-${exactOrder}`;
        section.className = 'space-y-3';
        section.innerHTML = `
          <div class="flex items-center gap-2 pb-2 border-b border-slate-800">
            <span class="px-2.5 py-1 rounded-lg text-xs font-bold bg-indigo-950 text-indigo-300 border border-indigo-700/60 font-mono-code">
              Total Order ${exactOrder} ${exactOrder === 0 ? '(Tree Level)' : ''}
            </span>
            <span class="text-xs text-slate-400">(${count} diagram${count > 1 ? 's' : ''})</span>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="grid-order-${exactOrder}">
          </div>
        `;
        root.appendChild(section);
        return section.querySelector(`#grid-order-${exactOrder}`);
      }
    };

    // ------------------------------------------------------------------------
    // Diagram inspector launcher
    // ------------------------------------------------------------------------
    window.openDiagramEditor = function(diagramData) {
      const shared = window.__DIAGRAM_SHARED_DATA || {};
      const payload = {
        version: 1,
        createdAt: Date.now(),
        diagramData,
        sharedData: shared
      };
      const token = 'feynman_inspect_' + Date.now() + '_' + Math.random().toString(36).slice(2);
      try {
        localStorage.setItem(token, JSON.stringify(payload));
      } catch (err) {
        alert('Unable to open diagram inspector: browser local storage is unavailable.');
        return;
      }
      const editorWindow = window.open('inspect.html#' + encodeURIComponent(token), '_blank');
      if (!editorWindow) {
        localStorage.removeItem(token);
        alert('The browser blocked the new tab. Please allow pop-ups for this site.');
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      if (window.MainEngine && typeof window.MainEngine.runOutputPage === 'function') {
        window.MainEngine.runOutputPage();
      }
    });
  </script>
</body>
</html>
