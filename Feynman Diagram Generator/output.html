<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feynman Diagram Generator - Graph Stream</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono-code { font-family: 'Fira Code', monospace; }
  </style>
</head>
<body class="min-h-full flex flex-col bg-slate-950 text-slate-100 p-3 sm:p-6 antialiased">

  <!-- Header Bar -->
  <header class="w-full max-w-7xl mx-auto flex items-center justify-between pb-3.5 border-b border-slate-800 sticky top-0 bg-slate-950/95 backdrop-blur z-30">
    <div class="flex items-center gap-3">
      <span id="status-pulse" class="w-3 h-3 rounded-full bg-indigo-500 animate-ping"></span>
      <div>
        <h1 id="header-status" class="text-xs sm:text-base font-bold text-slate-100 font-mono-code flex items-center gap-2">
          <span>Initializing Engine...</span>
        </h1>
        <p id="sub-status" class="text-xs text-cyan-300 font-mono-code font-semibold">(Loading Formula...)</p>
      </div>
    </div>
    
    <div>
      <button id="btn-stop-generation" type="button" onclick="handleStopClick()" class="px-4 py-2 rounded-xl text-xs font-bold bg-rose-600 hover:bg-rose-500 text-white shadow-lg shadow-rose-600/30 transition-all flex items-center gap-1.5 cursor-pointer active:scale-95">
        <i class="fa-solid fa-hand text-xs"></i>
        <span>Stop</span>
      </button>
    </div>
  </header>

  <!-- Output Container -->
  <main id="diagrams-root" class="w-full max-w-7xl mx-auto py-6 space-y-8 flex-1">
  </main>

  <!-- Scripts -->
  <script src="particles.js"></script>
  <script src="vertices.js"></script>
  <script src="graph_engine.js"></script>
  <script src="image_engine.js"></script>
  <script src="main.js"></script>

  <!-- Output UI Handler Object -->
  <script>
    function handleStopClick() {
      if (window.MainEngine) {
        window.MainEngine.stop();
      }
      const btn = document.getElementById('btn-stop-generation');
      if (btn) {
        btn.disabled = true;
        btn.classList.add('opacity-40', 'cursor-not-allowed');
      }
      document.getElementById('header-status').textContent = 'Generation Stopped by User';
      document.getElementById('header-status').className = 'text-xs sm:text-base font-bold text-amber-400 font-mono-code flex items-center gap-2';
      document.getElementById('status-pulse').className = 'w-3 h-3 rounded-full bg-amber-500';
    }

    window.OutputUI = {
      setFormula(formulaText) {
        document.getElementById('sub-status').textContent = formulaText;
      },

      setStatus(exactOrder, isComplete, totalCount) {
        const headerStatus = document.getElementById('header-status');
        const statusPulse = document.getElementById('status-pulse');
        const btnStop = document.getElementById('btn-stop-generation');

        if (isComplete) {
          headerStatus.textContent = `Generation Complete - Found ${totalCount} Diagram(s)`;
          headerStatus.className = 'text-xs sm:text-base font-bold text-emerald-400 font-mono-code flex items-center gap-2';
          statusPulse.className = 'w-3 h-3 rounded-full bg-emerald-400';
          if (btnStop) {
            btnStop.disabled = true;
            btnStop.classList.add('opacity-40', 'cursor-not-allowed');
          }

          if (totalCount === 0) {
            document.getElementById('diagrams-root').innerHTML = `
              <div class="text-center py-20 text-slate-500 font-mono-code border border-dashed border-slate-800 rounded-3xl m-4">
                No Feynman diagrams found matching these reaction constraints.
              </div>
            `;
          }
        } else {
          headerStatus.innerHTML = `<span>Generating Diagrams of Order ${exactOrder}</span>`;
        }
      },

      showError(message) {
        document.getElementById('header-status').textContent = 'Error';
        document.getElementById('header-status').className = 'text-xs sm:text-base font-bold text-rose-400 font-mono-code';
        document.getElementById('sub-status').textContent = message;
        document.getElementById('status-pulse').className = 'w-3 h-3 rounded-full bg-rose-500';
      },

      createOrderSection(exactOrder, count) {
        const root = document.getElementById('diagrams-root');
        const section = document.createElement('section');
        section.id = `section-order-${exactOrder}`;
        section.className = 'space-y-3';
        section.innerHTML = `
          <div class="flex items-center gap-2 pb-2 border-b border-slate-800">
            <span class="px-2.5 py-1 rounded-lg text-xs font-bold bg-indigo-950 text-indigo-300 border border-indigo-700/60 font-mono-code">
              Total Order ${exactOrder} ${exactOrder === 0 ? '(Tree Level)' : ''}
            </span>
            <span class="text-xs text-slate-400">(${count} diagram${count > 1 ? 's' : ''})</span>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="grid-order-${exactOrder}">
          </div>
        `;
        root.appendChild(section);
        return section.querySelector(`#grid-order-${exactOrder}`);
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      if (window.MainEngine && typeof window.MainEngine.runOutputPage === 'function') {
        window.MainEngine.runOutputPage();
      }
    });
  </script>
</body>
</html>
